<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Napište nám</title>
  <link rel="stylesheet" href="style.css">

</head>

<body>

  <main class="card-container">
    <div class="card">
      <header class="card-header">
        <h1 class="card-title">
          Napište nám
          <span class="status-dot" aria-hidden="true"></span>
        </h1>
        <p class="card-subtitle">Odpovíme vám obratem.</p>
      </header>

        <form id="question-form" class="question-form">

          <div class="field">
            <label for="name">Jméno a příjmení</label>
            <input type="text" id="name" name="name" required placeholder="Jan Novák">
          </div>

          <div class="field">
            <label for="email">E-mailová adresa</label>
            <input type="email" id="email" name="email" required placeholder="jan@example.cz">
          </div>

          <div class="field">
            <label for="message">Tvůj dotaz</label>
            <textarea id="question" name="message" rows="4" required placeholder="Napište zprávu..."></textarea>
          </div>

          <button type="submit" class="submit-button">Odeslat zprávu</button>

          <div id="answer" class="answer-box"></div>

        </form>
    </div>
  </main>

</body>
<script src="script.js"></script>
</html>
